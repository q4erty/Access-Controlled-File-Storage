databaseChangeLog:
  - changeSet:
      id: 010-create-support-request
      author: q4erty
      changes:
        - createTable:
            tableName: support_requests
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: subject
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: question
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: answer
                  type: TEXT
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: answered_by
                  type: BIGINT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: answered_at
                  type: TIMESTAMP

        - addForeignKeyConstraint:
            baseTableName: support_requests
            baseColumnNames: user_id
            constraintName: fk_support_request_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: support_requests
            baseColumnNames: answered_by
            constraintName: fk_support_request_answered_by
            referencedTableName: users
            referencedColumnNames: id
            onDelete: SET NULL
